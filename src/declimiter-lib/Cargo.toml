[package]
name = "declimiter-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
ndisapi = "0.6"
etherparse = "0.19.0"
log = "0.4.29"
derive-new = "0.7.0"
tokio = { version = "1.51", features = ["rt-multi-thread", "sync", "time"]}
thiserror = "2.0.18"
regex = "1.12.3"
sysinfo = { version = "0.38.4", features = ["windows", "default"]}
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
]}
