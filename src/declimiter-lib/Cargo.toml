[package]
name = "declimiter-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
ndisapi = "0.7.0"
etherparse = "0.21.0"
log = "0.4.35"
derive-new = "0.7.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time"]}
thiserror = "2.0.21"
regex = "1.13.1"
sysinfo = { version = "0.40.1", features = ["default"]}
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Threading",
]}

[dev-dependencies]
windows = { version = "0.62", features = ["Win32_System_Services"] }
