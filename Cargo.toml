[package]
name = "declimiter"
version = "0.1.1"
edition = "2024"

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
log = "0.4.35"
simple_logger = "5.2.0"
clap = { version = "4.6.7", features = ["default", "color", "help", "suggestions", "error-context"] }
clap_derive = "4.6.7"
declimiter-lib = { path = "src/declimiter-lib"}
thiserror = "2.0.21"
futures = { version = "0.3.34", features = []}
ratatui = "0.30.2"
eframe = "0.37.0"
egui_extras = "0.37.0"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
image = "0.25.10"
dirs = "7.0.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
ureq = "3.5.1"
sha2 = "0.11.1"

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
